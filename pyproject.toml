[project]
name = "uct-room-booking"
version = "0.1.0"
description = "Automate UCT library seat and room booking on LibCal"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "playwright>=1.59.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.3",
  "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
uct = "uctbook.cli:app"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uctbook"]
